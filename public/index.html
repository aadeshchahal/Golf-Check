<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golf-Check — Edmonton tee times</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0; padding: 1.5rem; max-width: 860px; margin-inline: auto;
        line-height: 1.4;
      }
      h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
      .sub { color: #888; margin: 0 0 1.25rem; font-size: 0.9rem; }
      form {
        display: grid; gap: 0.75rem 1rem; align-items: end;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        background: rgba(127,127,127,0.08); padding: 1rem; border-radius: 12px;
      }
      label { display: flex; flex-direction: column; font-size: 0.8rem; gap: 0.25rem; }
      input, select, button {
        font: inherit; padding: 0.5rem; border-radius: 8px;
        border: 1px solid rgba(127,127,127,0.4); background: transparent; color: inherit;
      }
      option { background: #1a1a1a; color: #fff; }
      @media (prefers-color-scheme: light) {
        option { background: #fff; color: #000; }
      }
      button {
        background: #2f9e44; color: white; border: none; cursor: pointer;
        font-weight: 600; grid-column: 1 / -1;
      }
      button:hover { background: #2b8a3e; }
      .seg { display: flex; gap: 0.25rem; }
      .seg button {
        flex: 1; grid-column: auto; background: transparent; color: inherit;
        border: 1px solid rgba(127,127,127,0.4);
      }
      .seg button.active { background: #2f9e44; color: white; border-color: #2f9e44; }
      input[type="range"] {
        -webkit-appearance: none; appearance: none;
        width: 100%; height: 6px; border-radius: 4px;
        background: rgba(127,127,127,0.3); outline: none; padding: 0; border: none;
        margin: 10px 0;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 20px; height: 20px; border-radius: 50%;
        background: #2f9e44; cursor: pointer; border: 2px solid #fff;
        box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      }
      #time-display { font-weight: 600; color: #2f9e44; margin-left: auto; }
      .time-label-wrap { display: flex; align-items: center; justify-content: space-between; width: 100%; }
      table { width: 100%; border-collapse: collapse; margin-top: 1.25rem; }
      th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid rgba(127,127,127,0.2); }
      th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: #888; }
      .pill { font-size: 0.75rem; padding: 0.1rem 0.45rem; border-radius: 999px; background: rgba(47,158,68,0.15); }
      .book { color: #2f9e44; text-decoration: none; font-weight: 600; }
      .status { margin-top: 1rem; font-size: 0.85rem; }
      .err { color: #e03131; }
      .muted { color: #888; }
      details { margin-top: 1rem; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <h1>⛳ Golf-Check</h1>
    <p class="sub">One search across Edmonton-area courses: Mill Woods, Eagle Rock, Coloniale, Victoria, Riverside.</p>

    <form id="form">
      <label>Date
        <input type="date" id="date" required />
      </label>
      <label>
        <div class="time-label-wrap">
          Around time <span id="time-display">8:00 AM</span>
        </div>
        <input type="range" id="time-slider" min="360" max="1200" step="15" value="480" />
        <input type="hidden" id="time" value="08:00" />
      </label>
      <label>Window
        <select id="window">
          <option value="30">± 30 min</option>
          <option value="60">± 1 hr</option>
          <option value="90" selected>± 1.5 hr</option>
          <option value="180">± 3 hr</option>
          <option value="720">Any time</option>
        </select>
      </label>
      <label>Players
        <select id="players">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <label>Holes
        <div class="seg" id="holes">
          <button type="button" data-holes="9">9</button>
          <button type="button" data-holes="18" class="active">18</button>
        </div>
      </label>
      <button type="submit">Search tee times</button>
    </form>

    <div class="status" id="status"></div>
    <table id="results" hidden>
      <thead>
        <tr><th>Time</th><th>Course</th><th>Holes</th><th>Open spots</th><th>Price</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <details id="courseStatus"></details>

    <script src="/app.js"></script>
  </body>
</html>
